{% extends 'scheduler/base.html' %}
{% load static %}

{% block title %}Sign Up - AutoPost{% endblock %}

{% block content %}
<div class="auth-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem;">
    <div class="auth-card" style="width: 100%; max-width: 440px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.5rem; box-shadow: var(--shadow-lg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: transform var(--transition);">
        
        <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
            <div class="logo-icon" style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--purple), var(--pink)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 15px var(--purple-glow); margin: 0 auto 1rem auto;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
                    <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
                    <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
                </svg>
            </div>
            <h2 style="font-size: 2rem; font-weight: 800; background: linear-gradient(135deg, var(--purple), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Create Account</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Join AutoPost to schedule your social media posts</p>
        </div>

        <form method="POST" action="{% url 'signup' %}" style="display: flex; flex-direction: column; gap: 1.25rem;">
            {% csrf_token %}
            
            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="email" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Gmail Address</label>
                <input type="email" id="email" name="email" value="{{ email|default:'' }}" required placeholder="email@gmail.com" 
                       style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.95rem; transition: border-color var(--transition-fast), box-shadow var(--transition-fast); outline: none;">
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="password" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" 
                       style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.95rem; transition: border-color var(--transition-fast), box-shadow var(--transition-fast); outline: none;">
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; gap: 0.5rem;">
                <label for="password_confirm" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Confirm Password</label>
                <input type="password" id="password_confirm" name="password_confirm" required placeholder="••••••••" 
                       style="width: 100%; padding: 0.85rem 1rem; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); font-size: 0.95rem; transition: border-color var(--transition-fast), box-shadow var(--transition-fast); outline: none;">
            </div>

            <button type="submit" class="btn btn-primary" 
                    style="width: 100%; padding: 0.85rem; background: linear-gradient(135deg, var(--purple), var(--purple-dark)); border: none; border-radius: var(--radius-md); color: white; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all var(--transition-fast); box-shadow: 0 4px 12px var(--purple-glow); margin-top: 0.5rem;">
                Create Account
            </button>
        </form>

        <div class="auth-footer" style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
            Already have an account? 
            <a href="{% url 'login' %}" style="color: var(--purple-light); font-weight: 600; text-decoration: none; margin-left: 0.25rem;">Sign In</a>
        </div>
        
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.style.borderColor = 'var(--purple)';
                input.style.boxShadow = '0 0 0 3px var(--purple-glow)';
            });
            input.addEventListener('blur', () => {
                input.style.borderColor = 'var(--border-color)';
                input.style.boxShadow = 'none';
            });
        });
    });
</script>
{% endblock %}
